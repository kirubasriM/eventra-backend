spring.application.name=backend

# Database configuration (supports environment variables DB_URL, DB_USERNAME, DB_PASSWORD with local fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventra_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server port
server.port=${PORT:8080}

# SMS Provider & OTP Configuration
sms.enabled=${OTP_SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:msg91}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:}
sms.template-id=${SMS_TEMPLATE_ID:}
sms.provider-url=${SMS_PROVIDER_URL:https://control.msg91.com/api/v5/flow/}
sms.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
sms.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
sms.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}

# Email Provider & OTP Configuration
email.enabled=${EMAIL_ENABLED:false}
email.provider=${EMAIL_PROVIDER:smtp}
email.host=${EMAIL_HOST:smtp.gmail.com}
email.port=${EMAIL_PORT:587}
email.username=${EMAIL_USERNAME:}
email.password=${EMAIL_PASSWORD:}
email.from=${EMAIL_FROM:no-reply@eventra.in}
email.api-url=${EMAIL_API_URL:}
email.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
email.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
email.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}
server.address=0.0.0.0
